<!DOCTYPE html>
<html>
<head>
    <title>Voting Eligibility</title>

    <script>
        function sum() {
            let age = parseInt(prompt("Enter your age"));

            if (age >= 18) {
                alert("You are eligible for voting");
            }
            else {
                alert("You are not eligible for voting");
            }
        }
    </script>
</head>

<body>

    <input type="button" onclick="sum()" value="Result">

</body>
</html>
