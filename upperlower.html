<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Methods</title>
</head>
<body>

<script>
    let Name = "Nischal";
    let Last = "Chauhan";


    document.write(Name.toLowerCase() + "<br>");
    document.write(Name.toUpperCase()+ "<br>");
    
    document.write(Name.slice(1, 5) + "<br>");

    
    document.write(Name.split("") + "<br>");
</script>

</body>
</html>
